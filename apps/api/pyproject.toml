[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motionledger-api"
version = "0.1.0"
description = "Evidence-first assembly process auditing with Meta Model API"
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "openai>=2.0.0",
  "meta-sam-parser>=0.1.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
  "scipy>=1.13.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0", "coverage>=7.6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["motionledger*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
